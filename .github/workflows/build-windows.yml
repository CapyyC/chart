name: Build Windows app

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: build_assets/models
          key: models-${{ hashFiles('autodrums/models.py') }}

      - name: Fetch models
        run: python tools/fetch_models.py build_assets/models

      - name: Fetch ffmpeg and deno
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force build_assets/bin, build_tmp | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile build_tmp/ffmpeg.zip
          Expand-Archive build_tmp/ffmpeg.zip build_tmp/ffmpeg
          Copy-Item (Get-ChildItem build_tmp/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName build_assets/bin/
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile build_tmp/deno.zip
          Expand-Archive build_tmp/deno.zip build_assets/bin
          & build_assets/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          & build_assets/bin/deno.exe --version

      - name: Build icon
        run: python packaging/make_icon.py

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/autodrums.spec

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          & dist/AutoDrums/autodrums-cli.exe selftest --report selftest.txt
          $code = $LASTEXITCODE
          Get-Content selftest.txt
          if ($code -ne 0) { exit 1 }

      - name: GUI smoke test
        shell: pwsh
        run: |
          $env:AUTODRUMS_SMOKE_SCREENSHOT = "$PWD\gui-smoke.png"
          $p = Start-Process -FilePath dist/AutoDrums/AutoDrums.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error "GUI did not exit" }
          if (-not (Test-Path gui-smoke.png)) { Write-Error "GUI did not render a window" }
          Write-Host "GUI started and rendered (exit code $($p.ExitCode))"

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import autodrums; print(autodrums.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist/AutoDrums -DestinationPath "dist/AutoDrums-$version-portable.zip" -CompressionLevel Fastest
          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AutoDrums-Setup
          path: dist/AutoDrums-Setup-*.exe
          compression-level: 0

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AutoDrums-portable
          path: dist/AutoDrums-*-portable.zip
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            selftest.txt
            gui-smoke.png
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoDrums-Setup-*.exe
            dist/AutoDrums-*-portable.zip
